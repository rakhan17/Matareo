name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Mesin Gradle Murni
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4' # Mengunduh mesin pembuat APK secara langsung

      - name: Mulai Merakit APK (Build Release)
        # Perhatikan: Kita memanggil 'gradle' langsung, bukan './gradlew'
        run: gradle assembleRelease

      - name: Simpan dan Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: Matareo-Beta-APK
          # Menggunakan tanda bintang agar otomatis mencari file APK di mana pun posisinya
          path: app/build/outputs/apk/**/*.apk