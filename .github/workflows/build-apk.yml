name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Wajib ditambah biar GitHub ngasih izin buat nge-upload file APK ke halaman Release
permissions:
  contents: write

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Mesin Gradle Murni
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Buat Kunci (Keystore) Sementara
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Mulai Merakit APK (Build Debug)
        run: gradle assembleDebug

      - name: Ubah Nama File APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Matareo.apk

      # --- BAGIAN AJAIBNYA DI SINI ---
      - name: Otomatis Upload ke GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/Matareo.apk"
          tag: "latest"
          name: "🔥 Matareo Versi Terbaru"
          body: "Aplikasi ini di-build secara otomatis setiap ada update kode."
          allowUpdates: true # Otomatis nimpa APK lama tiap kali kamu push
          token: ${{ secrets.GITHUB_TOKEN }}